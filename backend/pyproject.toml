[project]
name = "coolrx-api"
version = "1.0.0"
description = "CoolRx — prescription-grade urban cooling intelligence (API)"
# No `readme` key: setuptools rejects a path outside the package root, which made
# the backend uninstallable (`pip install -e .` failed the path assertion). The
# README stays at the repository root; packaging metadata simply omits it.
license = { text = "MIT" }

# Originally pinned to 3.12 on the assumption that the whole geospatial and ML
# stack lagged newest-Python on Windows wheels. That turned out to be too broad:
# pydantic, pyproj, sqlalchemy, lightgbm, numpy, reportlab, langgraph and the
# anthropic SDK all install from wheels on 3.14 and their test suites pass there.
#
# The narrower, still-real risk is rasterio and GDAL, needed only by the raster
# feature providers in `geo/`. Those remain unverified above 3.12, and on a miss
# pip falls back to building GDAL from source. Everything else runs on 3.14.
requires-python = ">=3.12,<3.15"

dependencies = [
    # ── Web ──────────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",

    # ── Data ─────────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.15",

    # ── Queue / cache ────────────────────────────────────────────────────────
    "redis>=5.2",
    "rq>=2.0",

    # ── HTTP ─────────────────────────────────────────────────────────────────
    "httpx>=0.27",
    "tenacity>=9.0",

    # ── Machine learning ─────────────────────────────────────────────────────
    "lightgbm>=4.5",
    "shap>=0.46",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",

    # ── Geospatial ───────────────────────────────────────────────────────────
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "rasterstats>=0.20",

    # ── Agent / LLM ──────────────────────────────────────────────────────────
    "langgraph>=0.2",
    "anthropic>=0.40",
    # Alternative narration provider. Its free tier needs no card, which matters
    # because a claude.ai subscription grants no API credit.
    "groq>=0.11",

    # ── Reporting ────────────────────────────────────────────────────────────
    # reportlab rather than weasyprint: weasyprint renders HTML through Pango and
    # Cairo, which on Windows means installing GTK system libraries separately — a
    # setup step that would break `pip install` for anyone cloning the repo.
    # reportlab ships pure-Python wheels and draws the document directly.
    "jinja2>=3.1",
    "reportlab>=4.2",

    # ── Observability ────────────────────────────────────────────────────────
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
]

[tool.setuptools]
# Flat layout with several top-level packages, so discovery must be explicit —
# automatic discovery refuses to guess and the build fails. `alembic` (migration
# scripts) and `data` (CSV/fixtures) are deliberately absent: neither is an
# importable package.
packages = [
    "agent",
    "clients",
    "controllers",
    "core",
    "geo",
    "middleware",
    "ml",
    "optimizer",
    "report",
    "repositories",
    "routes",
    "schemas",
    "workers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    # `tests/test_plan_report.py` reads the rendered PDF back rather than trusting
    # the builder, so the reader is a test requirement. Without it CI reported
    # three collection errors that looked like report regressions.
    "pypdf>=4.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
# BLE is selected so the `# noqa: BLE001` directives stay meaningful. Every
# broad `except Exception` in this codebase is deliberate -- a provider that
# degrades rather than raising, a readiness probe that must not itself fail --
# and each carries the reason on the same line. With the rule unselected those
# directives read as unused and an autofix deletes the reasoning with them.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "BLE"]
ignore = [
    "S101",  # assert is fine in tests

    # Each of the five below is a deliberate convention, not an unfixed warning.
    # They are listed here rather than suppressed line by line so the reason is
    # in one place and a reviewer can disagree with it in one place.

    # N818 — exception names without an `Error` suffix. `FortyGuardTimeout`,
    # `CreditReserveExhausted`, `ModelNotTrained` and `OutOfSupport` name the
    # condition the caller must handle, and they are referred to by these names
    # in the SRS and in `docs/`. Renaming thirteen classes across code, tests and
    # prose would churn more than the inconsistency costs.
    "N818",

    # RUF001/2/3 — "ambiguous" Unicode in strings, docstrings and comments. The
    # prose deliberately uses −, ×, – and σ where those are the correct
    # characters. In `agent/numeric_guard.py` the U+2212 MINUS SIGN is
    # load-bearing: the guard must recognise the typographic minus a language
    # model emits, so "correcting" it to a hyphen would open the bypass the
    # module exists to close.
    "RUF001",
    "RUF002",
    "RUF003",

    # RUF046 — `int(round(x))` flagged as a redundant cast. It is not redundant
    # here: the raster providers pass numpy scalars, and `round(np.float64)`
    # returns another numpy float rather than an int. Taking the cast out would
    # change the type flowing into the tile grid.
    "RUF046",

    # B008 — function calls in argument defaults. `Query(...)` and `Depends(...)`
    # in a signature is FastAPI's own idiom; the rule cannot see the framework.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# S311 stays enabled for the application, where `clients/fortyguard/client.py`
# suppresses it on the one line that needs it. In tests `random` only generates
# synthetic feature values from a fixed seed, so the rule has nothing to say.
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
# Third-party geospatial/ML packages ship incomplete stubs; the project's own
# code is still checked strictly.
[[tool.mypy.overrides]]
module = [
    "geopandas.*", "rasterio.*", "rasterstats.*", "shapely.*",
    "lightgbm.*", "shap.*", "sklearn.*", "weasyprint.*", "rq.*",
    # reportlab ships no stubs; `report/pdf.py` is the only importer and its own
    # signatures are still checked.
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
