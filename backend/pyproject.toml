[project]
name = "coolrx-api"
version = "1.0.0"
description = "CoolRx — prescription-grade urban cooling intelligence (API)"
readme = "../README.md"
license = { text = "MIT" }

# Pinned to 3.12 deliberately. The geospatial and ML stack below (rasterio,
# GDAL, shapely, pyproj, geopandas, lightgbm) lags newest-Python by months on
# Windows wheels; on 3.14 pip falls back to building GDAL from source, which can
# cost a full day. See SRS §30.1.
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── Web ──────────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",

    # ── Data ─────────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.15",

    # ── Queue / cache ────────────────────────────────────────────────────────
    "redis>=5.2",
    "rq>=2.0",

    # ── HTTP ─────────────────────────────────────────────────────────────────
    "httpx>=0.27",
    "tenacity>=9.0",

    # ── Machine learning ─────────────────────────────────────────────────────
    "lightgbm>=4.5",
    "shap>=0.46",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",

    # ── Geospatial ───────────────────────────────────────────────────────────
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "rasterstats>=0.20",

    # ── Agent / LLM ──────────────────────────────────────────────────────────
    "langgraph>=0.2",
    "anthropic>=0.40",

    # ── Reporting ────────────────────────────────────────────────────────────
    "jinja2>=3.1",
    "weasyprint>=63.0",

    # ── Observability ────────────────────────────────────────────────────────
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
# Third-party geospatial/ML packages ship incomplete stubs; the project's own
# code is still checked strictly.
[[tool.mypy.overrides]]
module = [
    "geopandas.*", "rasterio.*", "rasterstats.*", "shapely.*",
    "lightgbm.*", "shap.*", "sklearn.*", "weasyprint.*", "rq.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
