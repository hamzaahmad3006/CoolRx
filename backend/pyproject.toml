[project]
name = "coolrx-api"
version = "1.0.0"
description = "CoolRx — prescription-grade urban cooling intelligence (API)"
readme = "../README.md"
license = { text = "MIT" }

# Originally pinned to 3.12 on the assumption that the whole geospatial and ML
# stack lagged newest-Python on Windows wheels. That turned out to be too broad:
# pydantic, pyproj, sqlalchemy, lightgbm, numpy, reportlab, langgraph and the
# anthropic SDK all install from wheels on 3.14 and their test suites pass there.
#
# The narrower, still-real risk is rasterio and GDAL, needed only by the raster
# feature providers in `geo/`. Those remain unverified above 3.12, and on a miss
# pip falls back to building GDAL from source. Everything else runs on 3.14.
requires-python = ">=3.12,<3.15"

dependencies = [
    # ── Web ──────────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",

    # ── Data ─────────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.15",

    # ── Queue / cache ────────────────────────────────────────────────────────
    "redis>=5.2",
    "rq>=2.0",

    # ── HTTP ─────────────────────────────────────────────────────────────────
    "httpx>=0.27",
    "tenacity>=9.0",

    # ── Machine learning ─────────────────────────────────────────────────────
    "lightgbm>=4.5",
    "shap>=0.46",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",

    # ── Geospatial ───────────────────────────────────────────────────────────
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "rasterstats>=0.20",

    # ── Agent / LLM ──────────────────────────────────────────────────────────
    "langgraph>=0.2",
    "anthropic>=0.40",
    # Alternative narration provider. Its free tier needs no card, which matters
    # because a claude.ai subscription grants no API credit.
    "groq>=0.11",

    # ── Reporting ────────────────────────────────────────────────────────────
    # reportlab rather than weasyprint: weasyprint renders HTML through Pango and
    # Cairo, which on Windows means installing GTK system libraries separately — a
    # setup step that would break `pip install` for anyone cloning the repo.
    # reportlab ships pure-Python wheels and draws the document directly.
    "jinja2>=3.1",
    "reportlab>=4.2",

    # ── Observability ────────────────────────────────────────────────────────
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
# Third-party geospatial/ML packages ship incomplete stubs; the project's own
# code is still checked strictly.
[[tool.mypy.overrides]]
module = [
    "geopandas.*", "rasterio.*", "rasterstats.*", "shapely.*",
    "lightgbm.*", "shap.*", "sklearn.*", "weasyprint.*", "rq.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
